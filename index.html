function renderSide() {
  names = nameMatcher();
  const mb = $("mbody");
  mb.replaceChildren();
  for (const m of mems) {
    const h = nameHue(m.actor), card = el("div", "memcard mem");
    card.style.background = `hsl(${h} 30% 19%)`;
    card.style.borderColor = `hsl(${h} 35% 33%)`;
    const who = el("div", "who"), name = el("b", null, m.actor || "?");
    name.style.color = nameColor(m.actor);
    who.append(name);
    if (m.emotion) who.append(el("span", null, m.emotion));
    if (m.importance != null) who.append(el("span", null, "★ " + (+m.importance).toFixed(1)));
    who.append(el("span", "kind", (m.memType || "").toLowerCase()), promptBtn(m));
    const text = () => /\n/.test(m.content || "") // a diary written into memory: markdown ("Diary Entry: ## Title\n\n…")
      ? md(m.content.replace(/^([^#\n]{1,40}):\s*(#+ )/, "$2$1: ")) : colourNames(m.content);
    const foot = el("div", "foot", m.location || "");
    foot.append(rtSpan(m.time, "rt", m.location ? " · " : "") || "");
    const body = text();
    body.title = "Click to open it with the prompt that wrote it";
    body.addEventListener("click", ev => { // as a chat line does; the header and footer still flash its line
      if (getSelection().toString()) return;
      ev.stopPropagation();
      openCard(m);
    });
    card.append(who, body, foot);
    m.popup = prompt => showShot(m, who, [text(), foot.cloneNode(true)], prompt, null, "stack"); // short: above its prompt
    card.title = (m.tags || []).join(", ");
    cardClick(card, m);
    m.node = card;
  }
  for (const x of sideEv) x.node = eventCard(x);
  for (const x of omni) x.node = omniCard(x);
  for (const x of diaries) x.node = diaryCard(x);
  for (const x of saves) x.node = saveCard(x);
  side = [...mems, ...diaries, ...omni, ...saves, ...sideEv].sort((a, b) => a.at - b.at); // stable: memories, diaries, screenshots, saves, then events at the same line
  mb.append(...side.map(x => x.node));
  placeMarks();
  if (!side.length) mb.append(el("div", "note", LOCAL ? "No memories or events yet. Background knowledge entries aren't shown." : "Memories are read by serve.py: open http://localhost:8791/"));
  for (const c of document.querySelectorAll("#mtitle .n[data-key]")) c.textContent = side.filter(x => x.kind === c.dataset.key).length;
  if ($("modev")) { // 🧩 lists only the groups this view has events for
    let total = 0;
    for (const c of $("modev").querySelectorAll(".n[data-key]")) { total += +c.textContent; c.parentElement.hidden = c.textContent === "0"; }
    $("modev").querySelector("summary .n").textContent = total;
    $("modev").querySelector(".none").hidden = total > 0;
  }
  const atEnd = innerHeight + scrollY >= document.body.scrollHeight - 80;
  layout(); // the chat may have just narrowed, making the page taller
  if (atEnd) scrollTo(0, document.body.scrollHeight);
  renderScrubber();
  updatePosition();
}
$("dsrc").checked = !MD;
$("dsrc").addEventListener("change", () => { MD = !$("dsrc").checked; localStorage["snev.md"] = MD ? "1" : "0"; if (fillPrompt) { dbody.replaceChildren(); if ($("shot").classList.contains("withprompt")) fillPrompt(); } });
$("shot").addEventListener("click", ev => { if (ev.target === ev.currentTarget || ev.target.tagName === "IMG") $("shot").close(); }); // outside, or the picture

// ---- Polling ----
function reset() {
  feed.replaceChildren();
  rows = []; seen = new Set(); maxId = -1; lastLocation = null; mems = []; sideEv = []; side = []; omni = []; diaries = []; saves = [];
  $("mbody").replaceChildren(el("div", "note", LOCAL ? "No memories yet." : "Memories are read by serve.py: open http://localhost:8791/"));
  layout();
}

function ingest(events) {
  const fresh = events.filter(e => !seen.has(e.id)).sort((a, b) => a.id - b.id);
  if (!fresh.length) return false;
  const first = maxId < 0;
  // 📡 follows only while you're at the end: scrolled up to read, you stay put until you come back down (or press 🔚)
  const atEnd = atEndNow();
  for (const e of fresh) if (/^(dialogue_player|player_thoughts$)/.test(e.type || "")) // before rendering, so earlier lines know too
    for (const n of [e.data?.player_name, e.data?.speaker]) if (n) players.add(n); // both, as lines look them up either way
  names = nameMatcher(fresh); // 🎨 in the chat: names seen so far, this batch included
  for (const e of fresh) {
    seen.add(e.id); maxId = Math.max(maxId, e.id);
    if (hide.some(r => r.test(eventText(e)))) continue;
    const kind = sideKind(e.type || "");
    if (kind) { sideEv.push({ e, kind, at: Math.max(0, rows.length - 1) }); continue; } // placed after the line before it
    if (e.type === "persistent_generic" && rows.length && unwrap(eventText(rows.at(-1).e)) === unwrap(eventText(e))) continue; // repeats the narration just shown
    add(e);
  }
  const last = rows.at(-1)?.e;
  endMark.className = "endmark" + (archive ? "" : " live");
  const label = el("span", null, (!archive ? "Now" : archive.startsWith("conv:") ? "End of this day" : "End of this playthrough") + (last?.gameTimeStr ? " · " : ""));
  label.append(gameTime(last?.gameTimeStr));
  if (!archive) label.prepend(el("span", "pulse", "●")); // live
  endMark.replaceChildren(label);
  if (rows.length) feed.append(endMark); // moved back to the end after new lines
  renderScrubber();
  $("ndialog").textContent = feed.querySelectorAll(".msg:not(.bg):not(.game)").length;
  $("ngame").textContent = feed.querySelectorAll(".msg.game").length;
  $("nbg").textContent = feed.querySelectorAll(".msg.bg").length;
  $("nthought").textContent = feed.querySelectorAll(".thought").length;
  $("nnarr").textContent = feed.querySelectorAll(".narr").length;
  countActs();
  if (first || (atEnd && !document.body.classList.contains("hide-autoscroll"))) scrollTo(0, document.body.scrollHeight); // 📡 follow live
  updatePosition();
  markFollow();
  return true;
}

// archive = a playthrough database name from serve.py, or "" for the live game.
// gen stops a poll that was in flight when the view was switched from adding to the new view.
let archive = "", gen = 0, timer;
// ML: the modlist picked in History; LIVE_ML: the one being played (serve.py's pick: written to last). Live always reads LIVE_ML.
let ML = "", LIVE_ML = "";
const mlq = () => "ml=" + encodeURIComponent(archive ? ML : LIVE_ML);
function start() { clearTimeout(timer); reset(); poll(++gen); }

async function poll(g) {
  try {
    if (archive) { // a finished playthrough: load once, no polling
      const url = (archive.startsWith("conv:") ? `/local/conversation?day=${archive.slice(5)}` : `/local/events?db=${encodeURIComponent(archive)}`) + "&" + mlq();
      const events = await (await fetch(url)).json();
      if (g !== gen) return;
      ingest(events);
      loadMemories(g);
      $("dot").className = "dot arch";
      $("dot").title = "archived playthrough (not live)";
      return;
    }
    const events = maxId < 0 ? await fetchAll()
      : (await (await fetch(`${HOST}/?api=recent-events&count=${POLL_COUNT}`, { cache: "no-store" })).json()).events || [];
    if (g !== gen) return;
    // Newest id went backwards: another save or playthrough was loaded, so start over.
    // ponytail: misses a switch to a save whose newest id is higher; compare first-event ids if that bites.
    if (events.length && maxId >= 0 && Math.max(...events.map(e => e.id)) < maxId) return start();
    if (ingest(events)) loadMemories(g);
    $("dot").className = "dot ok";
    $("dot").title = "live";
  } catch {
    if (g !== gen) return;
    $("dot").className = "dot"; // game closed or server not up yet; keep trying
    $("dot").title = "not connected";
  }
  timer = setTimeout(() => poll(g), POLL_MS);
}

// Under serve.py (http://localhost:8791) older playthroughs can be picked from the menu.
const LOCAL = location.protocol.startsWith("http");
// Two kinds of history: the conversation log (every line ever said, by real day; survives loading older saves)
// and SkyrimNet's per-playthrough databases (with locations and game time, but cut back when an older save is loaded).
// One modlist at a time: picking one shows its newest playthrough (or Live, for the one being played).
async function fillHistory() {
  const q = "ml=" + encodeURIComponent(ML);
  const [days, list] = await Promise.all([fetch(`/local/conversation-days?${q}`).then(r => r.json()), fetch(`/local/playthroughs?${q}`).then(r => r.json())]);
  const live = el("option", null, `Live (current save · ${LIVE_ML})`);
  live.value = "";
  const conv = el("optgroup"), dbs = el("optgroup");
  conv.label = "Conversation log: every line, by real day";
  dbs.label = "Playthroughs, newest first (cut back when an older save loads)";
  for (const d of days) {
    const o = el("option", null, `${new Date(d.day + "T12:00").toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" })} · ${d.lines} lines`);
    o.value = "conv:" + d.day;
    conv.append(o);
  }
  for (const p of list) {
    const short = s => (s || "?").split(",")[0];
    const o = el("option", null, `${p.player || "(no player lines)"} · ${new Date(p.modified * 1000).toLocaleDateString()} · ${short(p.first_location)} → ${short(p.last_location)} · ${p.events} events`);
    o.value = p.db;
    o.title = `${p.first_time} → ${p.last_time}`;
    dbs.append(o);
  }
  $("pt").replaceChildren(live, dbs, conv); // playthroughs first, the long list of days after
  return list;
}
if (LOCAL) fetch("/local/modlists").then(r => r.json()).then(async mls => {
  for (const m of mls) {
    const o = el("option", null, m.name + (m.live ? " ●" : ""));
    o.value = m.name;
    o.title = m.folder + (m.live ? " (being played, or played last)" : "");
    $("ml").append(o);
  }
  ML = LIVE_ML = mls.find(m => m.live)?.name || "";
  const saved = new URLSearchParams(location.hash.slice(1)); // a refresh reopens the same view (see saveView)
  if (mls.some(m => m.name === saved.get("ml"))) ML = saved.get("ml");
  $("ml").value = ML;
  $("mlwrap").hidden = mls.length < 2; // one SkyrimNet folder: nothing to pick
  await fillHistory();
  $("ptwrap").hidden = false;
  const v = saved.get("view") || "";
  if (v && [...$("pt").options].some(o => o.value === v)) { archive = v; $("pt").value = v; start(); }
}).catch(() => {});
else { // opened from disk: say where the older playthroughs are instead of hiding the option
  $("ptwrap").replaceChildren("Older playthroughs: run serve.py, then open ", Object.assign(el("a", null, "localhost:8791"), { href: "http://localhost:8791/" }));
  $("ptwrap").hidden = false;
}
// #pt is absent when opened from disk (replaced by the hint above)
// The modlist and view live in the address (#ml=…&view=…), so a refresh or a bookmark opens them again.
function saveView() {
  const h = new URLSearchParams();
  if (ML && ML !== LIVE_ML) h.set("ml", ML);
  if (archive) h.set("view", archive);
  history.replaceState(null, "", String(h) ? "#" + h : location.pathname + location.search);
}
$("pt")?.addEventListener("change", ev => { archive = ev.target.value; saveView(); $("shot").close(); start(); });
$("ml")?.addEventListener("change", async ev => {
  ML = ev.target.value;
  const list = await fillHistory();
  archive = ML === LIVE_ML ? "" : list[0]?.db || ""; // the newest playthrough of a modlist that isn't running
  $("pt").value = archive;
  saveView(); $("shot").close(); start();
  menu.open = false;
});

// config.yaml. Reads the small part of YAML it uses: "key: value", lists of values ("- 'x'") and lists of maps
// ("- a: 1" then "  b: 2"). Values: 'quoted' or "quoted" text, yes/no/true/false, numbers, else plain text.
const hide = [];
function parseConfig(text) {
  const scalar = v => {
    v = v.trim();
    let q; // quoted, then maybe a " # comment"
    if ((q = v.match(/^'((?:[^']|'')*)'(?:\s+#.*)?$/))) return q[1].replace(/''/g, "'");
    if ((q = v.match(/^"([^"]*)"(?:\s+#.*)?$/))) return q[1];
    v = v.replace(/\s+#.*$/, "");
    if (/^(yes|true|on)$/i.test(v)) return true;
    if (/^(no|false|off)$/i.test(v)) return false;
    return v !== "" && !isNaN(v) ? +v : v;
  };
  const cfg = {};
  let key = null, item = null, m;
  for (const line of text.split(/\r?\n/)) {
    if (/^\s*(#|$)/.test(line)) continue;
    if ((m = line.match(/^(\w+):\s*(.*)$/))) { key = m[1]; item = null; cfg[key] = m[2].trim() ? scalar(m[2]) : []; continue; }
    if (!Array.isArray(cfg[key])) continue;
    if ((m = line.match(/^\s+-\s+(\w+):\s+(.*)$/))) { item = { [m[1]]: scalar(m[2]) }; cfg[key].push(item); continue; }
    if ((m = line.match(/^\s+-\s+(.*)$/))) { item = null; cfg[key].push(scalar(m[1])); continue; }
    if (item && (m = line.match(/^\s+(\w+):\s+(.*)$/))) item[m[1]] = scalar(m[2]);
  }
  return cfg;
}
async function loadConfig() {
  let cfg = {};
  try { cfg = parseConfig(await (await fetch("config.yaml", { cache: "no-store" })).text()); } catch {} // opened from disk: defaults
  for (const v of Array.isArray(cfg.hide) ? cfg.hide : []) {
    try { hide.push(new RegExp(v, "i")); } catch { console.warn("config.yaml: bad hide pattern", v); }
  }
  if (Array.isArray(cfg.column)) GROUPS = cfg.column.filter(g => g && g.label && g.types).flatMap(g => {
    try {
      return [{ key: "g-" + String(g.label).toLowerCase().replace(/[^a-z0-9]+/g, "") || "g", label: String(g.label),
                hue: +g.hue || 0, types: new RegExp(g.types), shown: g.shown !== false }];
    } catch { console.warn("config.yaml: bad column types", g.types); return []; }
  });
  if (cfg.memories === false) SHOW_MEM = false;
  if (cfg.omnisight === false) SHOW_OMNI = false;
  if (cfg.diary === false) SHOW_DIARY = false;
  buildColumnToggles();
}
loadConfig().then(start);
</script>
