<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyrimNet Event View</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --dw:min(720px,55vw); --bg:#14161a; --panel:#1d2026; --fg:#e4e1d8; --muted:#8a8f98; --line:#2a2e36; --you:#2f4a6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 "Segoe UI",system-ui,sans-serif; }

  header { position:sticky; top:0; z-index:5; display:flex; gap:12px; align-items:center;
           padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  header .where { flex:1; min-width:0; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .where b { color:var(--fg); font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; background:#a33; flex:none; }
  .dot.ok { background:#4a4; }
  .menu { position:relative; flex:none; }
  .menu summary { list-style:none; cursor:pointer; font-size:18px; line-height:1; padding:2px 6px; border-radius:4px; color:var(--muted); user-select:none; }
  .menu summary::-webkit-details-marker { display:none; }
  .menu summary:hover, .menu[open] summary { color:var(--fg); background:var(--line); }
  .menu .panel { position:absolute; right:0; top:30px; display:flex; flex-direction:column; gap:7px; white-space:nowrap;
                 padding:10px 14px; background:var(--panel); border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 18px #0008; }
  .menu label { font-size:13px; color:var(--muted); cursor:pointer; user-select:none; }
  .menu .sep { border-top:1px solid var(--line); padding-top:7px; }
  .menu .mlwrap { border-bottom:1px solid var(--line); padding-bottom:7px; }
  .menu.pick summary { font-size:17px; padding:2px 4px; color:inherit; }
  .menu.pick .panel { left:0; right:auto; z-index:6; }
  .menu.pick .n { color:var(--muted); font-size:12px; }
  .menu.pick summary::after { content:"▾"; margin-left:3px; font-size:14px; color:var(--fg); opacity:.75; } /* 🤝 📌 🧩 open a list */
  .menu .none { color:var(--muted); font-size:12.5px; font-style:italic; }
  body.hide-acts #acts summary, body.hide-marks #marks summary, body.hide-modev #modev summary { opacity:.35; filter:grayscale(1); }
  body.hide-acts #acts .panel label:not(.mlwrap), body.hide-marks #marks .panel label:not(.mlwrap), body.hide-modev #modev .panel label:not(.mlwrap) { opacity:.45; }
  .act-failed, .act-checks { opacity:.75; }
  .menu select { margin-left:4px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:2px 3px; font-size:12.5px; }
  .hist { flex:none; font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .hist a { color:#8fb0d6; }
  .hist select { max-width:340px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:2px 3px; font-size:12.5px; }
  .dot.arch { background:#777; }

  main { max-width:860px; margin:0 auto; padding:12px 14px 64px; }
  body.split { padding-right:var(--dw); } /* prompt panel open: the chat moves into the left column */
  body.split header { margin-right:calc(-1 * var(--dw)); } /* the header bar still spans both columns */
  .tbtn { cursor:pointer; font-size:17px; line-height:1; padding:2px 4px; border-radius:4px; user-select:none; }
  .tbtn:hover { background:var(--line); }
  .tbtn:has(input:not(:checked)) { opacity:.35; filter:grayscale(1); }
  .tbtn.txt { font-size:13px; margin-left:8px; }
  .tbtn .n { color:var(--muted); font-size:12px; }
  body.hide-align .tbtn.step { opacity:.35; filter:grayscale(1); cursor:default; background:none; } /* ⏫ ⏬ need 🔄️ */
  [data-i] { scroll-margin-top:96px; } /* below the header and the chat bar */
  .colbar { position:sticky; top:41px; z-index:4; display:flex; align-items:center; gap:10px; padding:10px 14px; font-size:13px;
            background:var(--panel); border-bottom:1px solid var(--line); }
  .colbar .fill { flex:1; }
  /* 📌 where a memory, diary entry or OmniSight picture was made; its card is in the context column */
  .mark { display:flex; align-items:center; gap:7px; margin:3px calc(-1 * var(--markreach, -10px)) 3px 10px; font-size:12px; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .mark::after { content:""; flex:1; border-top:1px dashed currentColor; opacity:.45; }
  .mark::before { content:""; order:9; margin-left:-7px; border-left:6px solid currentColor; border-block:4px solid transparent; opacity:.6; } /* ▸ after the line, pointing at the card's column */
  .mark:hover { color:var(--fg); }
  body.hide-marks .mark, body.hide-mark-mem .mark.mem, body.hide-mark-diary .mark.diary, body.hide-mark-omni .mark.omni { display:none; }
  /* the end of the chat: "Now" when live, the end of a playthrough or day in History */
  .endmark { display:flex; align-items:center; gap:12px; margin:14px 10px 6px;
             color:#d6c48f; font-weight:700; font-size:13px; letter-spacing:.04em; white-space:nowrap; }
  .endmark::before, .endmark::after { content:""; flex:1; border-top:1px solid currentColor; opacity:.45; }
  .endmark .pulse { color:#8fd19e; margin-right:5px; animation:nowpulse 2s ease-in-out infinite; }
  @keyframes nowpulse { 50% { opacity:.3; } }
  .divider { margin:18px 0 8px; text-align:left; color:var(--muted); font-size:12px; letter-spacing:.04em; }
  .divider span { background:var(--bg); padding:0 10px 0 0; }
  .divider::before { content:""; display:block; border-top:1px solid var(--line); margin-bottom:-9px; }
  .msg { display:flex; flex-direction:column; align-items:flex-start; margin:6px 0; }
  .who { font-size:12px; font-weight:600; margin:0 10px 2px; }
  .who .to { color:var(--muted); font-weight:400; }
  .bubble { max-width:78%; padding:7px 12px; border-radius:14px; background:var(--panel); border:1px solid var(--line); }
  .msg.you .bubble { background:var(--you); border-color:transparent; }
  body.hide-bubbles .bubble { background:none !important; border-color:transparent !important; } /* ☰ Show line bubbles off: bare text (beats the inline hue) */
  .msg.bg { opacity:.6; }
  .msg.empty { margin:3px 10px; color:var(--muted); font-size:12.5px; font-style:italic; }
  body.hide-empty .msg.empty { display:none; }
  /* Thoughts: a paler, greyer bubble in the thinker's hue (set inline), dashed because unspoken. Default = pale player blue. */
  .thought { width:fit-content; max-width:78%; margin:2px 0 6px; padding:7px 12px; border-radius:14px;
             border:1px dashed hsl(212 22% 44%); background:hsl(212 22% 31%); color:#dcd7cd; font-style:italic; }
  .bubble .to { color:var(--muted); font-style:italic; }
  .narr, .act { margin:10px 10px; font-style:italic; color:#d6c48f; }
  .other { margin:3px 10px; color:var(--muted); font-size:12.5px; }
  .t { color:var(--muted); font-size:11px; margin-left:6px; font-weight:400; }
  .type { display:inline-block; font:500 10.5px/1.6 "Segoe UI",system-ui,sans-serif; font-style:normal; color:var(--muted);
          border:1px solid var(--line); border-radius:4px; padding:0 5px; margin:0 6px; vertical-align:1px; letter-spacing:.02em; }

  /* Timeline scrubber: one block per stay in a location, width = number of events there. */
  #scrub { position:fixed; left:0; right:0; bottom:0; z-index:2; height:34px; display:flex;
           background:var(--panel); border-top:1px solid var(--line); cursor:pointer; user-select:none; touch-action:none; }
  .seg { flex:1 1 0; min-width:0; border-right:1px solid var(--bg); padding:0 6px; overflow:hidden;
         font-size:11px; line-height:33px; white-space:nowrap; text-overflow:ellipsis; color:var(--muted); }
  .seg.on { color:var(--fg); box-shadow:inset 0 2px 0 var(--fg); }
  #cursor { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--fg); pointer-events:none; display:none; z-index:1; }
  #curtime { position:absolute; top:3px; left:6px; white-space:nowrap; font-size:11.5px; line-height:1; padding:3px 6px; border-radius:4px;
             background:var(--bg); border:1px solid var(--line); color:var(--fg); }
  #curtime.flip { left:auto; right:6px; } /* near the right end: label on the left of the cursor */

  /* Click a line to see the LLM request behind it (in the popup). */
  main [data-i]:not(.divider) { cursor:pointer; border-radius:8px; }
  main [data-i]:not(.divider):hover { background:#ffffff08; }
  main [data-i].sel { background:#ffffff12; }
  /* Right column: the context column. */
  .side { position:fixed; top:41px; right:0; bottom:35px; z-index:3; /* between header and scrubber; top set from the header by layout() */ width:var(--dw); display:none; flex-direction:column;
          background:var(--panel); border-left:1px solid var(--line); box-shadow:-8px 0 24px #0009; }
  .side.open { display:flex; }
  #shot { max-width:min(1400px, 94vw); max-height:94vh; padding:12px 14px; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:10px; }
  #shot::backdrop { background:rgb(0 0 0 / .75); }
  #shot img { display:block; max-width:100%; max-height:64vh; margin:6px auto; border-radius:6px; cursor:zoom-out; }
  #shot .who { display:flex; gap:10px; align-items:baseline; font-size:13px; color:var(--muted); }
  #shot .txt { font-size:14.5px; line-height:1.45; max-width:110ch; margin:8px auto 0; }
  #shot .foot { font-size:12px; color:var(--muted); margin-top:6px; }
  #shot .who .x, #shot .who .picon { margin-left:auto; } /* 🧾, then × (a chat line: × alone) */
  #shot .who .picon + .x { margin-left:0; }
  #shot .who .picon.none { cursor:help; } /* no prompt: hover for why */
  #shot.withprompt .who .picon { opacity:1; background:hsl(0 0% 100% / .35); } /* shown */
  #shot .ppane { display:none; }
  /* 🧾 open: a picture's or diary's prompt on its left, a chat line or memory above its prompt (.stacked); each part scrolls on its own */
  #shot[open].withprompt { width:94vw; max-width:94vw; display:flex; gap:16px; }
  #shot.withprompt .ppane { display:flex; flex-direction:column; flex:1 1 55%; min-width:0; max-height:calc(94vh - 30px); font-size:13px; }
  #dbody { overflow:auto; flex:1; min-height:0; padding-right:4px; }
  .ppane .pbar { display:flex; align-items:center; gap:10px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .ppane .pbar .src { margin-left:auto; }
  #shot.withprompt .pmain { flex:1 1 45%; min-width:0; max-height:calc(94vh - 30px); overflow:auto; }
  #shot[open].withprompt.stacked { flex-direction:column; gap:10px; width:min(1300px, 94vw); height:94vh; }
  #shot.withprompt.stacked .pmain { flex:0 0 auto; max-height:40vh; }
  #shot.withprompt.stacked .ppane { flex:1 1 auto; min-height:0; max-height:none; }
  .ppane .note { color:var(--muted); margin:6px 0; }
  .side .top { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); font-size:13px; }
  .side .top .title { flex:1; min-width:0; display:flex; align-items:center; gap:10px; white-space:nowrap; } /* no overflow:hidden: it would clip the 🧩 menu */
  .side .x, #shot .x { cursor:pointer; color:var(--muted); font-size:20px; line-height:1; padding:0 4px; }
  .side .body { overflow:auto; padding:10px 14px 30px; font-size:13px; position:relative; }
  .memcard { margin:0 0 8px; padding:7px 11px; border-radius:10px; border:1px solid; cursor:pointer; line-height:1.4; transition:opacity .2s; }
  .memcard .who { display:flex; gap:8px; align-items:baseline; font-size:12px; color:var(--muted); }
  .memcard .who b { font-size:13px; }
  .memcard .who .kind { margin-left:auto; font:600 10px/1 "Segoe UI",sans-serif; letter-spacing:.06em; text-transform:uppercase; }
  .memcard .txt { margin:4px 0; font-size:13.5px; color:var(--fg); }
  .memcard .foot { font-size:11.5px; color:var(--muted); }
  .memcard.future { opacity:.4; }
  .memcard.now { box-shadow:0 0 0 1px var(--fg); }
  .memtick { position:absolute; top:0; width:3px; height:8px; margin-left:-1px; border-radius:0 0 2px 2px; pointer-events:none; }
  /* 🤏 compact: OmniSight descriptions and diaries cut to a few lines */
  body:not(.hide-compact) .memcard.omni .txt { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  body:not(.hide-compact) .memcard.omni img { height:90px; }
  /* short view with a picture: picture left, text beside it (as many lines as fit beside the picture) */
  body:not(.hide-compact) .memcard.omni:has(> a) { display:grid; grid-template-columns:160px 1fr; column-gap:10px; align-items:start; }
  body:not(.hide-compact) .memcard.omni:has(> a) > .who { grid-column:1 / -1; }
  body:not(.hide-compact) .memcard.omni:has(> a) > .foot { grid-column:2; }
  body:not(.hide-compact) .memcard.omni:has(> a) img { margin:3px 0 5px; }
  body:not(.hide-compact) .memcard.omni:has(> a) .txt { -webkit-line-clamp:4; margin:2px 0 0; }
  body:not(.hide-compact) .memcard.diary .md { max-height:3.4em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 45%, transparent); }
  .memcard .md { margin:4px 0; font-size:13.5px; line-height:1.45; }
  .memcard .md h1, .memcard .md h2, .memcard .md h3 { font-size:14px; margin:6px 0 2px; }
  .memcard.diary .md, .memcard.omni .txt { cursor:zoom-in; }
  #shot .pmain > .md { max-width:760px; margin:8px 4px; font-size:14px; line-height:1.55; }
  .memcard .md p, .pmain > .md p { margin:0 0 .8em; } /* diary paragraphs: a clear gap between them */
  .memcard .md p:last-child, .pmain > .md p:last-child { margin-bottom:0; }
  /* 🧾 on a card and in its popup: the prompt that wrote the card. Boxed, white-tinted when there is a prompt to show,
     grey when none was found (its tooltip says why). */
  .picon { cursor:pointer; border:1px solid hsl(0 0% 100% / .55); border-radius:3px; background:hsl(0 0% 100% / .2); opacity:.9;
           position:relative; display:inline-grid; place-items:center; width:18px; height:18px; box-sizing:border-box;
           align-self:center; flex:none; font-size:11px; line-height:1; } /* a square box */
  .picon:hover { opacity:1; background:hsl(0 0% 100% / .3); }
  .picon.none { border-color:hsl(0 0% 40% / .8); background:hsl(0 0% 22% / .85); opacity:1; }
  .picon.none > span { filter:grayscale(1); opacity:.45; } /* the 🧾 faded, a ❌ over it */
  .picon.none::after { content:"❌"; position:absolute; inset:0; display:grid; place-items:center; font-size:9px; }
  #shot .who .x { align-self:center; }
  #mbody.aligned { overflow:hidden; } /* 🔄️ the column follows the page; the wheel scrolls the page */
  /* 🔄️: faint vertical dashed lines through the gaps between cards, so the column reads as one track with the chat */
  #mbody.aligned { --dash:repeating-linear-gradient(to bottom, rgb(255 255 255 / .22) 0 3px, transparent 3px 6px);
                   background:var(--dash) 35% 0 / 1px 100% no-repeat local, var(--dash) 70% 0 / 1px 100% no-repeat local; }
  #mbody.aligned .memcard { margin:0; }
  .memcard img { display:block; width:100%; height:170px; object-fit:cover; border-radius:6px; margin:5px 0 3px; }
  .ppane details { border:1px solid var(--line); border-radius:6px; margin:8px 0; }
  .ppane summary { cursor:pointer; padding:6px 10px; color:var(--muted); }
  .ppane summary b { color:var(--fg); }
  .ppane details > div { padding:0 10px 8px; }
  .ppane .role { margin:10px 0 3px; font:600 11px/1 "Segoe UI",sans-serif; letter-spacing:.08em; text-transform:uppercase; color:#8fb0d6; }
  .ppane pre { margin:0; white-space:pre-wrap; word-break:break-word; font:12px/1.5 Consolas,"Cascadia Mono",monospace;
                background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:8px 10px; }
  .ppane pre .h { color:#d6c48f; font-weight:700; }             /* # heading */
  .ppane pre .l { color:#d6a35f; font-weight:700; }             /* - bullet / 1. */
  .ppane pre .b { color:#f0ece2; font-weight:700; }             /* **bold** */
  .ppane pre .i { color:#cfc9bb; font-style:italic; }           /* *italic* */
  .ppane pre .c { color:#9fd49a; }                              /* `code` and ``` blocks */
  .ppane pre .tg { color:#c79be0; }                              /* <tags> */
  .ppane pre .k { color:#8fb0d6; }                              /* [brackets] */
  .ppane pre .q { color:var(--muted); font-style:italic; }      /* > quote */
  .side .note { color:var(--muted); margin:6px 0; }
  .ppane .toc { flex:1; min-width:0; }
  .ppane .toc select { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:2px 4px; font:12.5px Consolas,"Cascadia Mono",monospace; }
  .ppane .src { color:var(--muted); font-size:12px; cursor:pointer; user-select:none; white-space:nowrap; }
  .ppane .md { background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:6px 12px; font-size:13.5px; line-height:1.5; overflow-wrap:anywhere; }
  /* consecutive messages from one role: one box, a dashed line between messages */
  .ppane .run { background:var(--bg); border:1px solid var(--line); border-radius:4px; }
  .ppane .run > .md, .ppane .run > pre { border:0; border-radius:0; background:none; }
  .ppane .run > * + * { border-top:1px dashed var(--line) !important; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin:12px 0 4px; color:#d6c48f; line-height:1.3; }
  .md h1 { font-size:17px; } .md h2 { font-size:15.5px; } .md h3 { font-size:14.5px; } .md h4, .md h5, .md h6 { font-size:13.5px; }
  .md p { margin:5px 0; }
  .md ul, .md ol { margin:4px 0; padding-left:1.4em; }
  .md li { margin:1px 0; }
  .md blockquote { margin:5px 0; padding-left:10px; border-left:3px solid var(--line); color:var(--muted); }
  .md hr { border:0; border-top:1px solid var(--line); margin:10px 0; }
  .md code { font:12px Consolas,"Cascadia Mono",monospace; background:var(--panel); border-radius:3px; padding:0 4px; color:#9fd49a; }
  .md pre { margin:6px 0; }
  .md .tg { color:#c79be0; font:12px Consolas,"Cascadia Mono",monospace; }
  .md .k { color:#8fb0d6; }

  body.hide-names #feed .nm, body.hide-names #mem .nm { color:inherit !important; }
  .eid, .tid { font:10.5px Consolas,"Cascadia Mono",monospace; font-style:normal; color:var(--muted); margin-left:8px; }
  body.hide-ids .eid { display:none; }
  body.hide-realtime .rt { display:none; }
  .rt { color:#8fb0d6; }
  .rtl { font:11px "Segoe UI",sans-serif; font-style:normal; margin-left:8px; }
  body.hide-thoughts .thought, body.hide-narr .narr, body.hide-acts .act, body.hide-bg .msg.bg, body.hide-dialog .msg:not(.bg) { display:none; }
  .grp { border:1.5px solid hsl(var(--h) 55% 68% / .45); background:hsl(var(--h) 55% 68% / .05); border-radius:10px; padding:3px 6px; margin:4px 0; }
  /* line bubbles off: the box takes the line bubbles' fill, and its thoughts the dark */
  body.hide-bubbles .grp { background:hsl(var(--h) 32% 19%); } /* a line bubble's shade */
  body.hide-bubbles .grp .thought { background:hsl(var(--h) 18% 12%) !important; }
  .ghead { font-size:12px; font-weight:600; margin:3px 2px 2px; }
  /* the player's turns stand out: shifted right (NPC boxes stop short of the right edge to make room), with thick sides */
  .grp:not(.you) { margin-right:40px; }
  .grp.you { margin-left:40px; border-left:5px solid hsl(var(--h) 55% 68% / .85); border-right:5px solid hsl(var(--h) 55% 68% / .85); }
  .gap { color:var(--muted); font-size:11px; font-style:italic; margin:4px 2px; }
  /* a box whose lines are all hidden by the menu toggles goes too */

</style>
</head>
<body>
<header>
  <span class="dot" id="dot" title="server"></span>
  <span class="where" id="where">Waiting for SkyrimNet on <b id="host"></b>…</span>
  <label class="tbtn" title="Colour names: in the chat and in the context column's cards"><input type="checkbox" data-toggle="names" checked hidden>🎨</label>
  <label class="tbtn" title="Context column: memories, diaries, OmniSight pictures and mod events beside the chat"><input type="checkbox" data-toggle="side" checked hidden>🗂️</label>
  <label class="hist" id="ptwrap" hidden title="Older playthroughs and days come from SkyrimNet's files on disk (needs serve.py)">History <select id="pt"></select></label>
  <details class="menu" id="menu">
    <summary title="Options">☰</summary>
    <div class="panel">
      <label id="mlwrap" class="mlwrap" hidden title="Modlist: its playthroughs, conversation log and prompts in History. Live is always the game being played (●).">modlist <select id="ml"></select></label>
      <label title="Dialogue lines SkyrimNet stored with no text: &quot;Lucia said nothing (empty line)&quot;"><input type="checkbox" data-toggle="empty" checked> Show empty responses</label>
      <label title="Event ids on each line, request ids on each prompt"><input type="checkbox" data-toggle="ids"> Show event ids</label>
      <label title="Real date and time on every line and card, next to the game time"><input type="checkbox" data-toggle="realtime" checked> Show real-world time</label>
      <label title="A filled, rounded box around each spoken line (off: the text alone, in its speaker's box)"><input type="checkbox" data-toggle="bubbles" checked> Show line bubbles</label>
    </div>
  </details>
</header>
<div id="cbar" class="colbar"><label class="tbtn" title="Show dialogue (yours and NPCs')"><input type="checkbox" data-toggle="dialog" checked hidden>💬 <span class="n" id="ndialog">0</span></label><label class="tbtn" title="Show thoughts"><input type="checkbox" data-toggle="thoughts" checked hidden>💭 <span class="n" id="nthought">0</span></label><label class="tbtn" title="Show narration (game master, narration, books, deaths…)"><input type="checkbox" data-toggle="narr" checked hidden>🧾 <span class="n" id="nnarr">0</span></label><details class="menu pick" id="acts"><summary title="Actions: pick which kinds to show">🤝 <span class="n" id="nact">0</span></summary><div class="panel" id="actpanel"><label class="mlwrap"><input type="checkbox" data-toggle="acts" checked> all actions</label></div></details><details class="menu pick" id="marks"><summary title="Markers where a memory was created, a diary written or an OmniSight picture taken (click one for its card): pick which kinds to show">📌 <span class="n" id="nmark">0</span></summary><div class="panel"><label class="mlwrap"><input type="checkbox" data-toggle="marks" checked> all markers</label><label><input type="checkbox" data-toggle="mark-mem" checked> 🧠 memories <span class="n" data-mark="mem">0</span></label><label><input type="checkbox" data-toggle="mark-diary" checked> 📔 diaries <span class="n" data-mark="diary">0</span></label><label><input type="checkbox" data-toggle="mark-omni" checked> 📷 OmniSight pictures <span class="n" data-mark="omni">0</span></label></div></details><label class="tbtn" title="Show background chatter (NPCs talking among themselves)"><input type="checkbox" data-toggle="bg" checked hidden>🗣️ <span class="n" id="nbg">0</span></label><span class="fill"></span><label class="tbtn" title="Keep scrolling: jump to the newest line as it arrives"><input type="checkbox" data-toggle="autoscroll" checked hidden>⤓</label></div>
<main id="feed"></main>
<nav id="scrub"><div id="cursor"><span id="curtime"></span></div></nav>
<aside id="mem" class="side"><div class="top"><span class="title" id="mtitle"></span><label class="tbtn" title="Compact: OmniSight pictures small with a few lines beside them, and the start of each diary (off: whole descriptions and diaries)"><input type="checkbox" data-toggle="compact" hidden>🤏</label><span class="tbtn step" id="mprev" title="Previous card: scroll the chat back to its 📌 marker (with 🔄️ line up on)">⏫</span><span class="tbtn step" id="mnext" title="Next card: scroll the chat on to its 📌 marker (with 🔄️ line up on)">⏬</span><label class="tbtn" title="Line up: each card beside the chat line it belongs to, scrolling with the chat"><input type="checkbox" data-toggle="align" hidden>🔄️</label><label class="tbtn" title="Keep scrolling: keep the card for what you're reading in view"><input type="checkbox" data-toggle="memscroll" checked hidden>⤓</label><span class="x" id="mclose" title="Hide this column (bring it back with 🗂️ in the top bar)">×</span></div><div class="body" id="mbody"></div></aside>
<dialog id="shot" title="Esc or a click outside closes"><div class="ppane" id="ppane"><div class="pbar"><div class="toc" id="dtocw" hidden><select id="dtoc" title="Sections of the open prompt: follows your scrolling, pick one to jump"></select></div><label class="src" title="Show the exact prompt text instead of rendered markdown"><input type="checkbox" id="dsrc"> source</label></div><div id="dbody"></div></div></dialog>
<script>
// Reads the same feed as the SkyrimNet dashboard's Home page. ?host=… overrides the server.
const HOST = new URLSearchParams(location.search).get("host")
  || (location.protocol.startsWith("http") && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) ? location.origin + "/sn" : "http://127.0.0.1:8080");
const POLL_COUNT = 50, POLL_MS = 1500; // recent-events never returns more than 50, so it's only for updates

// The whole current playthrough, in pages of 100 (the most /events?api=list gives at once). Used for the first load.
async function fetchAll() {
  const all = [];
  for (let off = 0; ; off += 100) {
    const d = await (await fetch(`${HOST}/events?api=list&offset=${off}&limit=100&sortBy=id&sortDesc=false`, { cache: "no-store" })).json();
    all.push(...(d.events || []));
    if (!d.events?.length || all.length >= (d.pagination?.total ?? 0)) return all;
  }
}

const $ = id => document.getElementById(id);
const feed = $("feed"), scrub = $("scrub"), cursor = $("cursor"), menu = $("menu");
let rows = [], seen = new Set(), maxId = -1, lastLocation = null, segs = [], mems = [];
const PLAYER_COLOR = "hsl(212 60% 72%)"; // a lighter version of the player's bubble blue
const players = new Set(); // player names seen in player lines, so "To <player>" gets the player's blue
let stay = null; // the current cell's divider: when it started (real time) and its duration span
let sideEv = [], side = []; // IntelEngine/political events for the right column; side = every card there, in chat order
let GROUPS = [
  { key: "g-intelengine", label: "IntelEngine", hue: 190, types: /^(intel_.*|follower_recruited)$/, shown: true },
  { key: "g-politicalengine", label: "PoliticalEngine", hue: 42, types: /^political_/, shown: true },
];
let SHOW_MEM = true, SHOW_OMNI = true, SHOW_DIARY = true; // config.yaml "memories:" / "omnisight:" / "diary:"
// Which 🧩 group an event's card goes to ("" = it stays in the chat): a config.yaml group, or for an event type the
// page has no line style for (another mod's), a group of its own named from the type: dragonsense_event -> "dragonsense".
// Automatic groups are skipped in the first lookup: follower_recruited's "follower" group must not take follower_joined.
const sideKind = t => GROUPS.find(g => !g.prefix && g.types.test(t))?.key || (!t || chatType(t) ? "" : autoGroup(t).key);
const chatType = t => t.startsWith("dialogue") || t === "npc_thoughts" || t === "player_thoughts" || ICON[t] || actGroup(t)
  || t === "diary_entry_created" || t === "gamemaster_dialogue" || t.includes("narration") || t === "persistent_generic" || t === "death";
function autoGroup(t) {
  const prefix = t.split("_")[0] || t, key = "g-" + prefix.toLowerCase().replace(/[^a-z0-9]+/g, "");
  let g = GROUPS.find(g => g.key === key);
  if (!g) {
    g = { key, label: prefix, hue: nameHue(prefix), types: new RegExp("^" + prefix.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(_|$)"), prefix };
    GROUPS.push(g);
    if ($("modev")) groupToggles(g); // the header is built already: add its toggles now
  }
  return g;
}
// "follower recruited" for intel_follower_recruited, "event" for dragonsense_event (the group says the rest)
const evKind = (t, g) => (g?.prefix ? t.slice(g.prefix.length).replace(/^_/, "") || t : t.replace(/^(intel|political)_/, "")).replace(/_/g, " ");
let omni = [], diaries = []; // OmniSight screenshots and diary entries, anchored like memories
$("host").textContent = HOST;

// Toggles, remembered across reloads.
function wireToggle(box) {
  const key = "snev." + box.dataset.toggle;
  if (localStorage[key] !== undefined) box.checked = localStorage[key] === "1";
  const apply = () => { document.body.classList.toggle("hide-" + box.dataset.toggle, !box.checked); localStorage[key] = box.checked ? "1" : "0"; };
  box.addEventListener("change", () => { apply(); layout(); updatePosition(); });
  apply();
}
if (localStorage["snev.fulltext"] && !localStorage["snev.compact"]) // ⤵️ full text became 🤏 compact: keep the choice
  localStorage["snev.compact"] = localStorage["snev.fulltext"] === "1" ? "0" : "1";
document.querySelectorAll("[data-toggle]").forEach(wireToggle);
document.addEventListener("click", e => { for (const d of document.querySelectorAll("details.menu")) if (!d.contains(e.target)) d.open = false; });

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text; // textContent only: event text is game/LLM output
  return n;
}

function nameHue(name) {
  let h = 0;
  for (const c of name || "") h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h % 360;
}
const nameColor = name => `hsl(${nameHue(name)} 55% 68%)`;

const stripTags = s => (s || "").replace(/<[^>]+>/g, "").trim();
const clock = e => (e.gameTimeStr || "").split(",")[0];
const place = e => e.location || "Unknown";
// "1:27 PM, Sundas, 17th of Last Seed, 4E 201 · (Whiterun, near the Door to Warmaiden's)": hold and Outdoors dropped.
// Conversation-log "locations" are session labels, already shown as dividers.
// The cell, without the "near the Door to …" / "Close to …" detail that flickers as you walk about:
// "Whiterun, near the Door to Warmaiden's, Hold: Whiterun, Outdoors" and "Some distance from Dragonsreach, Whiterun, Outdoors" are both "Whiterun".
const cell = e => place(e).split(", ").filter(p => !/^near the /.test(p)).filter((p, k, a) => !(k === 0 && a.length > 1 && /^(Some distance from|Close to) /.test(p)))[0];
// Approximate real-world duration from seconds: "<1 min", "~12 min", "~1 h 20 min".
const realDur = sec => sec < 60 ? "<1 min" : sec < 3600 ? `~${Math.round(sec / 60)} min` : `~${Math.floor(sec / 3600)} h ${Math.round(sec % 3600 / 60)} min`;
const activeGap = sec => sec > 0 && sec < 20 * 60 ? sec : 0;
const meta = e => [e.gameTimeStr, archive.startsWith("conv:") ? "" : `(${place(e).replace(/, Hold:.*$/, "").replace(/, Outdoors$/, "")})`].filter(Boolean).join(" · ");
// The header's time line; with ☰ Show real-world time on, also when it happened at your desk ("11/25/2026 8:34am").
// The conversation log's times are real already, so it gets none.
function rtSpan(sec, cls = "rt", sep = " · ") { // null without a time, and in the conversation log
  if (!sec || archive.startsWith("conv:")) return null;
  const d = new Date(sec * 1000);
  return el("span", cls, sep + d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).replace(/\s/g, "").toLowerCase());
}
function metaNode(e) {
  const t = el("span", "t", e.gameTimeStr || "");
  const rt = rtSpan(e.localTime);
  if (rt) t.append(rt);
  const where = meta({ ...e, gameTimeStr: "" }); // "(place)", after the times
  if (where) t.append((e.gameTimeStr ? " · " : "") + where);
  return t;
}
const unwrap = s => s.trim().replace(/^\*([^*]+)\*$/, "$1");

// Same label as the dashboard's Events tab: the raw type with underscores as spaces.
const badge = type => el("span", "type", (type || "event").replace(/_/g, " "));

const NO_BADGE = /^(dialogue|npc_thoughts$|player_thoughts$|gamemaster_dialogue$|direct_narration$|persistent_generic$)/;
// Shown in the chat as a narration line behind an icon, without a tag.
const ICON = { book_read: "📖", book_read_manual: "📖", book_reading_stopped: "📖", sleep_start: "💤", sleep_stop: "💤" };
// Actions NPCs (or you) carried out, by kind: a line behind the kind's icon, each kind switched in the 🤝 menu.
// Event cards configured for the context column are taken out of the chat first, so a type there never lands here.
const ACT_GROUPS = [
  { key: "custom", icon: "🎬", label: "custom actions", types: /^custom_action$/ },
  { key: "trade", icon: "🪙", label: "trades and purchases", types: /^(trade_.*|item_purchased)$/ },
  { key: "gold", icon: "💰", label: "gold and debts", types: /^(gold_given|payment_collected|debt_created)$/ },
  { key: "items", icon: "🎁", label: "items given and taken", types: /^(item_given|item_taken_from_player|item_picked_up|book_borrowed)$/ },
  { key: "loot", icon: "🗝️", label: "looting", types: /^([cC]ontainer_looted|container_searched|corpse_looted|combat_spoils)$/ },
  { key: "food", icon: "🍖", label: "eating and drinking", types: /^item_consumed$/ },
  { key: "fight", icon: "👊", label: "brawls and fights", types: /^(brawl_.*|yield_broken)$/ },
  { key: "theft", icon: "🫳", label: "pickpocketing", types: /^pickpocket$/ },
  { key: "follow", icon: "🧭", label: "followers", types: /^(follower_(joined|left|dismissed|left_voluntarily|stays)|follow_distance|companion_.*)$/ },
  { key: "furniture", icon: "🪑", label: "furniture", types: /^furniture_(used|stopped)$/ },
  { key: "failed", icon: "⚠️", label: "failed actions", types: /_(failed|not_found|unreachable|in_use)$/, off: true },
  { key: "checks", icon: "📊", label: "relationship checks", types: /^(relationship_(assessed|adjusted)|interfollower_assessed)$/, off: true },
];
// A speaker's box goes too when everything in it is hidden: one rule per mix of 💬, 💭 and 🗣️ turned off.
(function groupHideRules() {
  const kinds = [["dialog", ".msg:not(.bg)"], ["thoughts", ".thought"], ["bg", ".msg.bg"]], rules = [];
  for (let m = 1; m < 8; m++) {
    const off = kinds.filter((_, i) => m & 1 << i);
    rules.push(`body${off.map(k => ".hide-" + k[0]).join("")} .grp:not(:has(> :not(${off.map(k => k[1]).join(", ")}, .ghead, .gap)))`);
  }
  const st = el("style");
  st.textContent = rules.join(",\n") + " { display:none; }";
  document.head.append(st);
})();
const actGroup = t => ACT_GROUPS.find(g => g.types.test(t));
const actIcon = t => actGroup(t)?.icon;
(function buildActMenu() {
  const css = [];
  for (const g of ACT_GROUPS) {
    const l = el("label"), box = el("input"), n = el("span", "n", "0");
    box.type = "checkbox"; box.checked = !g.off; box.dataset.toggle = "act-" + g.key;
    n.dataset.act = g.key;
    l.title = g.types.source;
    l.append(box, ` ${g.icon} ${g.label} `, n);
    $("actpanel").append(l);
    wireToggle(box);
    css.push(`body.hide-act-${g.key} .act-${g.key}`);
  }
  const st = el("style");
  st.textContent = css.join(", ") + " { display:none; }";
  document.head.append(st);
})();
// Event ids are SkyrimNet's (the database's); the conversation log has none, only line numbers, so they're left off there.
const hasIds = () => !archive.startsWith("conv:");
function render(e) {
  const n = renderBody(e);
  if (n.matches(".narr, .act, .other, .mark")) { const rt = rtSpan(e.localTime, "rt rtl", ""); if (rt) n.append(rt); }
  if (hasIds() && e.id != null) (n.querySelector(".bubble") || n).append(el("span", "eid", "#" + e.id)); // shown with ☰ Show event ids
  if (NO_BADGE.test(e.type || "") || ICON[e.type] || actIcon(e.type || "")) return n;
  const who = n.querySelector(".who");
  if (who) who.insertBefore(badge(e.type), who.querySelector(".t"));
  else n.prepend(badge(e.type));
  return n;
}

// Events read from the databases (serve.py) have no formatted_text, so fall back to the stored fields.
function plainText(e) {
  const d = e.data || {};
  if ("dialogue" in d && !d.dialogue) return `${d.speaker || d.player_name || "Someone"} said nothing (empty line)`;
  if ("narration" in d && !d.narration) return "(empty narration)";
  return stripTags(e.formatted_text) || d.line || d.narration || d.raw || (d.book_title && "Read " + d.book_title) || fields(d);
}
// Last resort for events that only have fields (trades, sleep…): "merchant: Orgnar · items bought: 1x Venison Chop"
const fields = d => Object.entries(d).filter(([k, v]) => !k.startsWith("_") && !k.endsWith("form_id") && v !== "" && v !== null && typeof v !== "object")
  .map(([k, v]) => `${k.replace(/_/g, " ")}: ${v}`).join(" · ");

// A chat line whose names are coloured (🎨).
function colourLine(cls, text) { const n = el("div", cls); n.append(colourNames(text, "span")); return n; }
// Trades have only fields when read from the database.
function actText(e) {
  const d = e.data || {}, t = stripTags(e.formatted_text);
  if (t || !e.type.startsWith("trade_")) return t || plainText(e);
  const who = d.merchant || "a merchant";
  if (e.type !== "trade_complete") return `Trading with ${who}`;
  const what = [d.items_bought && "bought " + d.items_bought, d.items_sold && "sold " + d.items_sold].filter(Boolean).join("; ") || "nothing changed hands";
  return `Trade with ${who}: ${what}` + (d.net_gold ? ` (${d.net_gold > 0 ? "+" : ""}${d.net_gold} gold)` : "");
}

function renderBody(e) {
  const d = e.data || {};
  const type = e.type || "";

  if (d.dialogue && type.startsWith("dialogue")) {
    const you = type.startsWith("dialogue_player");
    const m = el("div", "msg" + (you ? " you" : "") + (type === "dialogue_background" ? " bg" : ""));
    const speaker = d.speaker || d.player_name || "?", listener = d.listener || d.target; // older events: player_name/target
    const bubble = el("div", "bubble", type === "dialogue_background" ? "🗣️ " : null); // 🗣️ marks background chatter (replaces its tag)
    if (listener) { // the listener's name in their colour: the player's blue, or the NPC's name colour
      const to = el("span", "to", "To "), nm = el("span", "nm", listener);
      nm.style.color = players.has(listener) ? PLAYER_COLOR : nameColor(listener);
      to.append(nm, ": ");
      bubble.append(to);
    }
    // With actions off, small models add made-up "ACTION: speak" stubs, or put ACTION: before more speech;
    // SkyrimNet only strips the ones it runs. Drop the label and a lowercase stub, keep any sentence after it.
    bubble.append(colourNames(String(d.dialogue).replace(/\s*\bACTION:\s*(?:[a-z][a-z ,\x27]*?(?=[A-Z]|\n|$))?/g, " ").trim(), "span"));
    if (!you) { // same hue as the speaker's name, dark enough to keep text readable (the player's: --you)
      const h = nameHue(speaker);
      bubble.style.background = `hsl(${h} 32% 19%)`;
      bubble.style.borderColor = `hsl(${h} 38% 32%)`;
    }
    m.append(bubble);
    return m;
  }
  if (type.startsWith("dialogue") && "dialogue" in d) { // an empty line ("Lucia said nothing"): small, and hidden with 💬 (or 🗣️)
    return el("div", "msg empty" + (type === "dialogue_background" ? " bg" : ""), plainText(e));
  }
  if (type === "npc_thoughts" || type === "player_thoughts") {
    const t = colourLine("thought", "💭 " + (type === "player_thoughts" && !(d.player_name || d.speaker) ? "You: " : "") + (d.thoughts || stripTags(e.formatted_text)));
    if (type === "npc_thoughts") { // speech bubble is hsl(h 32% 19%): lighter and less saturated here
      const h = nameHue(d.npc_name);
      t.style.background = `hsl(${h} 16% 28%)`;
      t.style.borderColor = `hsl(${h} 20% 42%)`;
    }
    return t;
  }
  if (ICON[type]) {
    const t = type.startsWith("book_read") ? d.book_title || stripTags(d.book_name || "") || plainText(e) // book_name can carry <alias=…> tags
      : type === "sleep_start" ? stripTags(e.formatted_text) || `${d.actor || "Someone"} goes to sleep`
      : type === "sleep_stop" ? stripTags(e.formatted_text) || `${d.actor || "Someone"} wakes up` + (d.interrupted ? " (woken)" : "")
      : plainText(e);
    return colourLine("narr", ICON[type] + " " + unwrap(t));
  }
  const ag = actGroup(type);
  if (ag) return colourLine("act act-" + ag.key, ag.icon + " " + unwrap(actText(e)));
  if (type === "diary_entry_created") { // the entry itself is a 📔 card in the context column
    const m = el("div", "mark diary", "📔 "), nm = el("span", "nm", d.actor || "?");
    nm.style.color = nameColor(d.actor);
    m.append(nm, " diary written");
    m.addEventListener("click", () => { // the prompt popup opens too (the diary request)
      const i = rows.findIndex(r => r.e === e), mine = diaries.filter(x => x.actor === d.actor);
      flashCard(mine.sort((a, b) => Math.abs(a.at - i) - Math.abs(b.at - i))[0]);
    });
    return m;
  }
  if (type === "gamemaster_dialogue" || type.includes("narration") || type === "persistent_generic") {
    return colourLine("narr", unwrap(d.dialogue || d.narration || plainText(e))); // already italic, so drop the *…* around it
  }
  if (type === "death") {
    return colourLine("narr", "☠ " + (d.victim || d.actor_name || "Someone") + " falls" + (d.killer ? " to " + d.killer : "") + ".");
  }
  const o = el("div", "other", plainText(e) || type);
  o.title = type;
  return o;
}

// Within one speaker's box, a pause of at least this many in-game minutes shows as "N minutes passed".
const GAP_MINUTES = 10;
const passed = s => {
  const m = Math.round(s / 60), h = Math.floor(m / 60), r = m % 60;
  const part = (n, u) => `${n} ${u}${n === 1 ? "" : "s"}`;
  return (h ? part(h, "hour") + (r ? " " + part(r, "minute") : "") : part(m, "minute")) + " passed";
};

function add(e) {
  const i = rows.length;
  // A divider when the cell changes (or, in the conversation log, the session); finer moves show in each speaker's meta line.
  if (cell(e) !== lastLocation) {
    const div = el("div", "divider");
    div.dataset.i = i;
    const span = el("span", null, place(e) + " · " + (e.gameTimeStr || ""));
    stay = { last: e.localTime, total: 0, dur: el("span", "dur") };
    span.append(stay.dur);
    div.append(span);
    feed.append(div);
    lastLocation = cell(e);
  }
  // Real time spent here so far. Gaps over 20 minutes (game closed, a break) don't count, as with the conversation log's sessions.
  if (e.localTime && stay.last) stay.total += activeGap(e.localTime - stay.last);
  stay.last = e.localTime || stay.last;
  stay.dur.textContent = stay.last ? " · ⏱ " + realDur(stay.total) + " real time" : "";
  const node = render(e);
  node.dataset.i = i;
  // Someone's consecutive thoughts and lines share one box under their name, outlined in their colour (the player's: blue).
  const d = e.data || {}, t = e.type || "";
  const who = t === "npc_thoughts" ? d.npc_name : t === "player_thoughts" ? d.player_name || d.speaker
    : d.dialogue && t.startsWith("dialogue") ? d.speaker || d.player_name : "";
  let box = feed.lastElementChild;
  if (who && !(box?.classList.contains("grp") && box.dataset.who === who)) { // a divider in between also starts a new box
    box = el("div", "grp" + (players.has(who) ? " you" : ""));
    box.dataset.who = who;
    const you = players.has(who), h = you ? 212 : nameHue(who); // 212: PLAYER_COLOR's hue
    box.style.setProperty("--h", h); // its outline and fill (CSS .grp)
    const head = el("div", "ghead"), name = el("span", null, who);
    name.style.color = you ? PLAYER_COLOR : nameColor(who);
    head.append(name, metaNode(e));
    box.append(head);
    feed.append(box);
  } else if (who && e.gameTime - box.dataset.t >= GAP_MINUTES * 60) { // gameTime is in game seconds; NaN without it
    box.append(el("div", "gap", passed(e.gameTime - box.dataset.t)));
  }
  if (who) box.dataset.t = e.gameTime;
  (who ? box : feed).append(node);
  rows.push({ e, node });
}

// ---- Timeline scrubber ----
function renderScrubber() {
  scrub.replaceChildren(cursor);
  segs = [];
  for (let i = 0; i < rows.length; i++) {
    const e = rows[i].e, last = segs[segs.length - 1];
    if (last && last.loc === cell(e)) { last.end = i; continue; }
    segs.push({ loc: cell(e), start: i, end: i });
  }
  for (const s of segs) {

// Index of the event at the top of the viewport (what you're reading).

  const bottom = $("scrub").getBoundingClientRect().top, ahead = side.map(m => { // read every position, then restyle

    if (fence) { if (/^\s*```/.test(line)) fence = null; else fence.append(line + "\n"); continue; }
    if (/^\s*```/.test(line)) { list = para = null; fence = el("pre"); root.append(fence); continue; }
    if (!line.trim()) { list = para = null; continue; }

function requestBlock(r, open, why) {

    new Date(+r.response_timestamp_unix).toLocaleString(), r.source && `from ${r.source}`, why].filter(Boolean);
  s.append(el("b", null, r.use_case || "dialogue"), " · " + facts.join(" · "), el("span", "eid", r.request_id || ""));

// The popup for a memory, diary entry, OmniSight picture or chat line: its header and `body`, and behind its 🧾 the prompt
// that wrote it (fetched the first time it is shown). `layout`: "" puts the prompt on the left (pictures, diaries); "stack"

  const stacked = !!layout;

// 🧾 on a memory, diary or OmniSight card (top line, after its kind): the card's popup (x.popup) with the prompt that wrote it beside it,
// found the same way as a chat line's. Greyed (markInputs) when no prompt can be found for it.
function promptBtn(x) {

// SkyrimNet's live log (since launch, has token counts) plus, under serve.py, the prompt log files on disk: tens of MB,
// so fetched once per modlist and again only for something newer than the last fetch (t, in ms). list: null if neither answers.

function requestLog(t) {

  if (LOCAL) sources.push(fetch(`/local/requests?${mlq()}`).then(r => r.json()));

// A Narrative Engine plot memory ("X asked me to … so I set off to do it") is filled in by the mod from its director's JSON
// plan, so its sentence is in no reply. Its prompt is that plan's request: a narrative_engine_* reply from just before the

    const b = x.node?.querySelector(".picon"), t = (x.time || 0) * 1000;

// x: the card, for memories (a memory tied to no chat event that no reply holds was written by a mod, not by a model).

    return "Written by a mod's code, not by a model: no reply holds it and it is tied to no chat event" + (tags.length ? ` (tags: ${tags.slice(0, 4).join(", ")}).` : ".");
  const oldest = reqs.reduce((a, r) => Math.min(a, +r.request_timestamp_unix), Infinity);

// Table of contents for the open prompt: one dropdown line above the popup's prompt column. Lists each message

// ---- Memories (serve.py reads them from the playthrough database) ----
// Two columns whenever the right side has something: the open prompt, or the memories.
// 🔄️ Line up: each card at the page height of the chat line it belongs to, pushed down where cards crowd. The column
// scrolls with the page through pairs (line y, card y): one to one where cards have room, faster through crowded
// stretches, so the card for the line at the top of the chat is always beside it.
const aligned = () => !document.body.classList.contains("hide-align");
// ⏫ ⏬ (with 🔄️ on): scroll the chat to the previous or next card's 📌 marker (or its line, with markers off), bringing it
// a third of the way down the chat, where its card lines up beside it. Hidden cards are skipped. Pressed again while the
// page is still gliding, it steps on from where that glide ends.
let stepTo = null; // page y the last step is gliding to
function stepCard(dir) {
  if (!aligned()) return;
  const bar = $("cbar").getBoundingClientRect().bottom, ref = bar + (innerHeight - bar) / 3;
  const base = stepTo ?? scrollY, at = base + ref; // page y of the reference line, once the glide in progress ends
  const cards = side.filter(x => x.node.offsetParent).map(x => [x, (x.mark?.offsetParent ? x.mark : rows[x.at]?.node)?.getBoundingClientRect().top])
    .filter(([, y]) => y != null).map(([x, y]) => [x, y + scrollY]) // [card, its marker's page y]
    .filter(([, y]) => dir > 0 ? y > at + 4 : y < at - 4);

  const [x, y] = cards.reduce((a, b) => (dir > 0 ? b[1] < a[1] : b[1] > a[1]) ? b : a);
  stepTo = Math.max(0, Math.min(y - ref, document.documentElement.scrollHeight - innerHeight));

}
addEventListener("scrollend", () => { stepTo = null; });
for (const [id, dir] of [["mprev", -1], ["mnext", 1]]) $(id).addEventListener("click", e => {
  if (!aligned()) return;
  e.currentTarget.animate([{ boxShadow: "0 0 0 1.5px var(--fg)" }, { boxShadow: "0 0 0 1.5px transparent" }], 450); // flash its border
  stepCard(dir);
});
let alignPts = [], alignKey = "", alignShort = 0;
const endMark = el("div", "endmark"); // after the last line: "Now" (live) or the end of a playthrough or day // alignShort: how far the last cards are below the column at the page's end
const alignSpacer = el("div"); // room under the last card; padding on the column would make the column itself taller // [line's page y, card's y in the column], first card of each line, line y increasing
const sizes = () => document.documentElement.scrollHeight + "|" + $("mbody").scrollHeight;
function alignSide() {
  const mb = $("mbody"), on = aligned() && side.length > 0;
  alignPts = []; alignKey = ""; alignShort = 0;
  mb.classList.toggle("aligned", on);
  for (const x of side) x.node.style.marginTop = "";
  alignSpacer.style.height = "0";
  if (!on) return;
  mb.append(alignSpacer); // last, after renderSide refilled the column
  const cards = side.filter(x => x.node.offsetParent);
  if (!cards.length) return;
  const lineY = at => { let j = Math.min(at, rows.length - 1); while (j > 0 && !rows[j].node.offsetParent) j--; return rows[j] ? Math.round(rows[j].node.getBoundingClientRect().top + scrollY) : 0; }; // whole pixels: crowded stretches multiply any error
  const want = cards.map(x => x.mark?.offsetParent ? Math.round(x.mark.getBoundingClientRect().top + scrollY) : lineY(x.at)), hs = cards.map(x => x.node.getBoundingClientRect().height); // exact: whole-pixel heights add up over hundreds of cards
  let end = cards[0].node.offsetTop; // the column's top padding
  cards.forEach((x, k) => {
    const top = Math.max(want[k], end + (k ? 8 : 0));
    x.node.style.marginTop = top - end + "px";
    if (!alignPts.length || want[k] > alignPts.at(-1)[0]) alignPts.push([want[k], top]);
    end = top + hs[k];
  });
  alignPts = easeAlign(alignPts);
  alignSpacer.style.height = Math.max(30, document.documentElement.scrollHeight - end + innerHeight) + "px";
  // At the bottom of the page the column stops where alignScroll puts it. If the last cards are still below its edge,
  // updatePosition makes up the difference over the last screen of scrolling (cards run a little ahead of their lines there).
  const vp = $("cbar").getBoundingClientRect().bottom, refMax = document.documentElement.scrollHeight - innerHeight + vp;

}
// Where cards bunch up (six markers in 150px of chat, 2000px of cards), keeping each card beside its marker would
// scroll the column many times faster than the chat. Cap that at ALIGN_MAX_RATE: the column starts moving earlier and
// catches up later, so in a bunch each card sits a little ahead of or behind its marker instead of flying past.
// Each point keeps its column position; its chat position moves to halfway between the earliest and latest it could be.

}

  return alignPts.length ? alignY(Math.round(scrollY + vp)) - (vp - mb.getBoundingClientRect().top) : 0;

$("mbody").addEventListener("wheel", ev => { if (!aligned()) return; ev.preventDefault(); scrollBy(0, ev.deltaY); }, { passive: false });

addEventListener("resize", () => { layout(); updatePosition(); });

function layout() {

async function loadMemories(g) {
  const q = (!archive ? "db=live" : archive.startsWith("conv:") ? `day=${archive.slice(5)}` : `db=${encodeURIComponent(archive)}`) + "&" + mlq();
  const get = async (what, on) => { try { return on && LOCAL ? await (await fetch(`/local/${what}?${q}`, { cache: "no-store" })).json() : []; } catch { return []; } };
  let [list, shots, dl] = await Promise.all([get("memories", SHOW_MEM), get("omnisight", SHOW_OMNI), get("diary", SHOW_DIARY)]);
  if (g !== gen) return;
  if (!Array.isArray(list) || !rows.length) list = []; // nothing to anchor to yet
  if (!Array.isArray(shots) || !rows.length) shots = [];
  if (!Array.isArray(dl) || !rows.length) dl = [];
  const byTime = t => { let at = 0; for (let i = 0; i < rows.length && (rows[i].e.localTime || 0) <= t; i++) at = i; return at; };
  omni = shots.map(x => ({ ...x, subject: x.kind, kind: "omni", at: byTime(x.time) })); // subject: actor, location…
  // Anchor each memory to the latest event it came from; failing that (conversation log, unknown ids), to when it was formed.
  const byId = new Map(rows.map((r, i) => [r.e.id, i]));
  const conv = archive.startsWith("conv:");
  const anchor = m => {
    const at = conv ? -1 : Math.max(-1, ...(m.events || []).map(id => byId.get(id) ?? -1));
    return { ...m, at: at < 0 ? byTime(m.time) : at };
  };
  mems = list.map(m => ({ ...anchor(m), memType: m.kind, kind: "mem" })).sort((a, b) => a.at - b.at || a.time - b.time);
  diaries = dl.map(m => ({ ...anchor(m), kind: "diary" }));
  // SkyrimNet also stores each diary entry as a memory ("Diary Entry: ## Title…"): with 📔 loaded, keep only the diary card
  const head = t => flat(diaryText(t)).slice(0, 80), written = new Set(diaries.map(d => head(d.content)));
  mems = mems.filter(m => diaryText(m.content) === m.content || !head(m.content) || !written.has(head(m.content)));
  renderSide();
  markInputs();
}

// Clicking a card shows where it belongs in the chat: its 📌 marker (or, with none, its line) lights up, as a marker's
// card does when you click the marker. The chat scrolls only when that is off screen, so a click doesn't throw the page around.
function cardClick(card, x) {
  card.addEventListener("click", () => {
    if (getSelection().toString()) return; // selecting text
    const n = x.mark?.offsetParent ? x.mark : rows[x.at]?.node;
    if (!n) return;
    const r = n.getBoundingClientRect();
    if (r.top < $("cbar").getBoundingClientRect().bottom || r.bottom > innerHeight - 35) n.scrollIntoView({ block: "center" });
    flash(n); flash(card); // both ends of the pair light up
  });
}

// Event cards (IntelEngine, PoliticalEngine…): what happened, when, and which kind, in their group's colour.
function eventCard(x) {
  const e = x.e, g = GROUPS.find(g => g.key === x.kind), h = g?.hue ?? 0, card = el("div", "memcard " + x.kind);
  card.style.background = `hsl(${h} 25% 17%)`;
  card.style.borderColor = `hsl(${h} 30% 30%)`;
  const who = el("div", "who"), src = el("b", null, g?.label || x.kind);
  src.style.color = `hsl(${h} 55% 68%)`;
  who.append(src, el("span", null, e.gameTimeStr || ""), rtSpan(e.localTime, "rt", "") || "", el("span", "kind", evKind(e.type, g)));
  card.append(who, colourNames(plainText(e).replace(/\s*\[PE event [^\]]*\]\s*$/, ""))); // drop the political engine's debug suffix
  cardClick(card, x);
  return card;
}

// Every name seen in this view (speakers, listeners, thinkers, memory owners), with and without its "[Whiterun Guard]"-style
// tag, mapped to its colour; matched whole-word, longest first, so "Bill [Guard]" is one name even when "Guard" is another NPC's.
let names = null;
function nameMatcher(extra = []) {
  const col = new Map();
  const add = n => {
    n = (n || "").trim();
    const c = players.has(n) ? PLAYER_COLOR : nameColor(n);
    for (const k of [n, n.replace(/\s*\[[^\]]*\]$/, "")]) if (k.length > 1 && !col.has(k)) col.set(k, c);
  };
  for (const e of [...rows.map(r => r.e), ...extra]) { const d = e.data || {}; add(d.speaker); add(d.listener); add(d.npc_name); add(d.player_name); add(d.target); }
  for (const m of mems) add(m.actor);
  if (!col.size) return null;
  const alt = [...col.keys()].sort((a, b) => b.length - a.length).map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  return { re: new RegExp(`(?<![\\w'])(?:${alt})(?![\\w'])`, "g"), col };
}

  text = String(text ?? "");
  const out = el(tag, tag === "div" ? "txt" : null);
  let last = 0;
  if (names) for (const m of text.matchAll(names.re)) {
    const s = el("span", "nm", m[0]);
    s.style.color = names.col.get(m[0]);
    out.append(text.slice(last, m.index), s);
    last = m.index + m[0].length;
  }
  out.append(text.slice(last));
  return out;
}

// OmniSight: a screenshot SkyrimNet took of someone or somewhere, with its AI description. Click the picture for full size.
function omniCard(x) {
  const h = 280, card = el("div", "memcard omni");
  x.popup = prompt => { // the picture large with the whole description
    const body = [];
    if (x.image) { const big = el("img"); big.src = `/local/shot?${mlq()}&name=` + encodeURIComponent(x.image); big.alt = x.name || ""; body.push(big); }
    body.push(colourNames(x.description || ""));
    if (x.location) body.push(el("div", "foot", x.location));
    showShot(x, who, body, prompt);
  };
  const popup = ev => { // the card's 📌 flash doesn't fire
    if (getSelection().toString()) return;
    ev.stopPropagation();
    x.popup();
  };
  card.style.background = `hsl(${h} 20% 18%)`;
  card.style.borderColor = `hsl(${h} 25% 32%)`;
  const who = el("div", "who"), name = el("b", null, "📷 " + (x.name || "?"));
  name.style.color = x.subject === "actor" ? nameColor(x.name) : `hsl(${h} 55% 72%)`;
  who.append(name, el("span", null, x.gameTimeStr || ""), rtSpan(x.time, "rt", "") || "", el("span", "kind", x.subject || ""), promptBtn(x));
  card.append(who);
  if (x.image) {
    const a = el("a"), img = el("img");
    a.href = img.src = `/local/shot?${mlq()}&name=` + encodeURIComponent(x.image);
    img.loading = "lazy";
    img.alt = x.name || "";
    a.addEventListener("click", ev => { ev.preventDefault(); popup(ev); }); // middle-click still opens a tab
    a.append(img);
    card.append(a);
  }

  text.title = "Click to read the whole description";
  text.addEventListener("click", popup);
  card.append(text);
  if (x.location && x.location !== x.name) card.append(el("div", "foot", x.location));
  cardClick(card, x);

// Light up a card (outline) or chat line (backdrop) at once, hold it a moment, then fade it out. Clicked again, it restarts.
function flash(n) {
  const look = n.classList.contains("memcard") ? { boxShadow: "0 0 0 2px var(--fg)" }
    : { background: "#ffffff1c", borderRadius: "6px", boxShadow: "0 0 0 1px #ffffff55" };
  n.getAnimations().forEach(a => a.id === "flash" && a.cancel());
  n.animate([look, { ...look, offset: .3, easing: "ease-in" }], { duration: 1400, id: "flash" }); // fades to its own style
}
// Bring a context-column card into view and outline it for a moment.
function flashCard(x) {
  const mb = $("mbody"), c = x?.node;
  if (!c || document.body.classList.contains("hide-side")) return;
  if (!aligned()) mb.scrollTop = c.offsetTop - mb.clientHeight / 2 + c.offsetHeight / 2;
  flash(c);
}

// 📌 Markers in the chat after the line each memory, diary entry or screenshot belongs to. Rebuilt with the column.
// A diary whose diary_entry_created event is in the chat gets none: that event is its marker (matched by the entry's text).
function placeMarks() {
  for (const m of feed.querySelectorAll(".mark.sm")) m.remove();
  const head = t => String(t || "").trim().slice(0, 80);
  const logged = new Set(rows.filter(r => r.e.type === "diary_entry_created").map(r => head(r.e.data?.entry_contents)));
  const after = new Map(); // top-level chat node -> last marker placed after it, so markers keep the column's order
  for (const x of side) {
    x.mark = null;
    const kind = x.kind; // mem, diary, omni, or a 🧩 group's key (x.e: its event)
    const row = rows[x.at]?.node;
    if (!row || (kind === "diary" && logged.has(head(x.content)))) continue;
    let top = row;
    while (top.parentElement && top.parentElement !== feed) top = top.parentElement; // after the speaker's box, not inside it
    let m;
    if (x.e) { // "🧩 IntelEngine · follower recruited", in the group's colour
      const g = GROUPS.find(g => g.key === kind), src = el("span", "nm", g?.label || kind);
      src.style.color = `hsl(${g?.hue ?? 0} 55% 68%)`;
      m = el("div", "mark sm ev " + kind, "🧩 ");
      m.append(src, " · " + evKind(x.e.type, g), rtSpan(x.e.localTime, "rt rtl", "") || "");
    } else {
      const who = kind === "omni" ? x.name : x.actor;
      m = el("div", "mark sm " + kind, { mem: "🧠 ", diary: "📔 ", omni: "📷 " }[kind]);
      const nm = el("span", "nm", who || "?");
      nm.style.color = kind === "omni" && x.subject !== "actor" ? "" : players.has(who) ? PLAYER_COLOR : nameColor(who);
      m.append(nm, { mem: " memory created", diary: " diary written", omni: " captured" }[kind], rtSpan(x.time, "rt rtl", "") || "");
    }
    m.addEventListener("click", ev => { ev.stopPropagation(); flashCard(x); }); // not the prompt popup
    (after.get(top) || top).after(m);
    after.set(top, m);
    x.mark = m; // 🔄️ lines the card up with this, not its line inside the speaker's box
  }
  $("nmark").textContent = feed.querySelectorAll(".mark").length;
  for (const n of document.querySelectorAll("#marks .n[data-mark]")) { // 📌 lists only the kinds this view has
    n.textContent = feed.querySelectorAll(".mark." + n.dataset.mark).length;
    n.parentElement.hidden = n.textContent === "0";
  }
}

// A diary entry: what an NPC wrote about a stretch of events, rendered as markdown.
function diaryCard(x) {
  const h = nameHue(x.actor), card = el("div", "memcard diary");
  card.style.background = `hsl(${h} 24% 17%)`;
  card.style.borderColor = `hsl(${h} 30% 34%)`;
  const who = el("div", "who"), name = el("b", null, "📔 " + (x.actor || "?"));
  name.style.color = nameColor(x.actor);
  who.append(name);
  if (x.emotion) who.append(el("span", null, x.emotion));
  who.append(el("span", "kind", "diary"), promptBtn(x));
  const foot = el("div", "foot", x.location || "");
  foot.append(rtSpan(x.time, "rt", x.location ? " · " : "") || "");
  const text = md(x.content || "");
  text.title = "Click to read the whole entry";
  x.popup = prompt => showShot(x, who, [md(x.content || ""), foot.cloneNode(true)], prompt); // the whole entry
  text.addEventListener("click", ev => { // the header and footer still flash its line
    if (getSelection().toString()) return;
    ev.stopPropagation();
    x.popup();
  });
  card.append(who, text, foot);
  cardClick(card, x);
  return card;

// Column header: 🧠, 📔, 📷, then the 🧩 menu of config groups (other mods' events). Counts are filled in by renderSide(),
// which also leaves out of 🧩 the groups with no events in this view.
function buildColumnToggles() {
  const t = $("mtitle"), css = [];
  const add = (key, text, title, txt, shown) => {
    const l = el("label", "tbtn" + (txt ? " txt" : "")), box = el("input"), n = el("span", "n", "0");
    box.type = "checkbox"; box.hidden = true; box.checked = shown !== false; box.dataset.toggle = key;
    n.dataset.key = key;
    l.title = title;
    l.append(box, text + " ", n);
    t.append(l);
    wireToggle(box);
    css.push(`body.hide-${key} .memcard.${key}`, `body.hide-${key} .mark.${key}`); // the card and its 📌 marker
  };
  if (SHOW_MEM) add("mem", "🧠", "Show memories", false);
  if (SHOW_DIARY) add("diary", "📔", "Show diary entries", false);
  if (SHOW_OMNI) add("omni", "📷", "Show OmniSight screenshots", false);
  const menu = el("details", "menu pick"), sum = el("summary"), panel = el("div", "panel"), all = el("label", "mlwrap"), box = el("input");
  menu.id = "modev";

  sum.append("🧩 ", el("span", "n", "0"));
  box.type = "checkbox"; box.checked = true; box.dataset.toggle = "modev";
  all.append(box, " all mod events");
  panel.append(all, el("div", "none", "None in this view")); // 🧩 stays in the header even then
  menu.append(sum, panel);
  t.append(menu);
  wireToggle(box);
  for (const g of GROUPS) groupToggles(g);
  const st = el("style");
  st.textContent = css.join(", ") + " { display:none !important; }"; // beats layout rules such as the short view's display:grid
  document.head.append(st);
}

// A 🧩 group's entries in the 🧩 and 📌 menus, and the rules hiding its cards and markers.
function groupToggles(g) {
  const l = el("label"), b = el("input"), n = el("span", "n", "0");
  b.type = "checkbox"; b.checked = g.shown !== false; b.dataset.toggle = g.key;
  n.dataset.key = g.key;
  l.title = g.prefix ? `${g.prefix}_… events: a type this page has no line style for (likely another mod's), grouped by itself.
To rename or recolour it, add a column: group in config.yaml.`
    : `Events matching ${g.types.source} (config.yaml column: group)`;
  l.append(b, ` ${g.label} `, n);
  $("modev").querySelector(".panel").append(l);
  wireToggle(b);
  const ml = el("label"), mb = el("input"), mn = el("span", "n", "0"); // its own entry in the 📌 menu
  mb.type = "checkbox"; mb.checked = true; mb.dataset.toggle = "mark-" + g.key;
  mn.dataset.mark = g.key;
  ml.append(mb, ` 🧩 ${g.label} `, mn);
  document.querySelector("#marks .panel").append(ml);
  wireToggle(mb);
  const st = el("style"), k = g.key; // the cards, and with them their 📌 markers; !important beats layout rules
  st.textContent = `body.hide-${k} .memcard.${k}, body.hide-modev .memcard.${k}, body.hide-${k} .mark.${k}, body.hide-modev .mark.${k},
    body.hide-mark-${k} .mark.${k} { display:none !important; }`;
  document.head.append(st);
}

function renderSide() {
  names = nameMatcher();
  const mb = $("mbody");
  mb.replaceChildren();
  for (const m of mems) {
    const h = nameHue(m.actor), card = el("div", "memcard mem");
    card.style.background = `hsl(${h} 30% 19%)`;
    card.style.borderColor = `hsl(${h} 35% 33%)`;
    const who = el("div", "who"), name = el("b", null, m.actor || "?");
    name.style.color = nameColor(m.actor);
    who.append(name);
    if (m.emotion) who.append(el("span", null, m.emotion));
    if (m.importance != null) who.append(el("span", null, "★ " + (+m.importance).toFixed(1)));
    who.append(el("span", "kind", (m.memType || "").toLowerCase()), promptBtn(m));
    const text = () => /\n/.test(m.content || "") // a diary written into memory: markdown ("Diary Entry: ## Title\n\n…")
      ? md(m.content.replace(/^([^#\n]{1,40}):\s*(#+ )/, "$2$1: ")) : colourNames(m.content);
    const foot = el("div", "foot", m.location || "");
    foot.append(rtSpan(m.time, "rt", m.location ? " · " : "") || "");
    const body = text();
    body.title = "Click to open it with the prompt that wrote it";
    body.addEventListener("click", ev => { // as a chat line does; the header and footer still flash its line
      if (getSelection().toString()) return;
      ev.stopPropagation();
      openCard(m);
    });
    card.append(who, body, foot);
    m.popup = prompt => showShot(m, who, [text(), foot.cloneNode(true)], prompt, null, "stack"); // short: above its prompt
    card.title = (m.tags || []).join(", ");
    cardClick(card, m);
    m.node = card;
  }
  for (const x of sideEv) x.node = eventCard(x);
  for (const x of omni) x.node = omniCard(x);
  for (const x of diaries) x.node = diaryCard(x);
  side = [...mems, ...diaries, ...omni, ...sideEv].sort((a, b) => a.at - b.at); // stable: memories, diaries, screenshots, then events at the same line
  mb.append(...side.map(x => x.node));
  placeMarks();
  if (!side.length) mb.append(el("div", "note", LOCAL ? "No memories or events yet. Background knowledge entries aren't shown." : "Memories are read by serve.py: open http://localhost:8791/"));
  for (const c of document.querySelectorAll("#mtitle .n[data-key]")) c.textContent = side.filter(x => x.kind === c.dataset.key).length;
  if ($("modev")) { // 🧩 lists only the groups this view has events for
    let total = 0;
    for (const c of $("modev").querySelectorAll(".n[data-key]")) { total += +c.textContent; c.parentElement.hidden = c.textContent === "0"; }
    $("modev").querySelector("summary .n").textContent = total;
    $("modev").querySelector(".none").hidden = total > 0;
  }
  const atEnd = innerHeight + scrollY >= document.body.scrollHeight - 80;
  layout(); // the chat may have just narrowed, making the page taller
  if (atEnd) scrollTo(0, document.body.scrollHeight);
  renderScrubber();
  updatePosition();
}
$("dsrc").checked = !MD;
$("dsrc").addEventListener("change", () => { MD = !$("dsrc").checked; localStorage["snev.md"] = MD ? "1" : "0"; if (fillPrompt) { dbody.replaceChildren(); if ($("shot").classList.contains("withprompt")) fillPrompt(); } });
$("shot").addEventListener("click", ev => { if (ev.target === ev.currentTarget || ev.target.tagName === "IMG") $("shot").close(); }); // outside, or the picture

// ---- Polling ----
function reset() {
  feed.replaceChildren();
  rows = []; seen = new Set(); maxId = -1; lastLocation = null; mems = []; sideEv = []; side = []; omni = []; diaries = [];
  $("mbody").replaceChildren(el("div", "note", LOCAL ? "No memories yet." : "Memories are read by serve.py: open http://localhost:8791/"));
  layout();
}

function ingest(events) {
  const fresh = events.filter(e => !seen.has(e.id)).sort((a, b) => a.id - b.id);
  if (!fresh.length) return false;
  const first = maxId < 0;
  for (const e of fresh) if (/^(dialogue_player|player_thoughts$)/.test(e.type || "")) // before rendering, so earlier lines know too
    for (const n of [e.data?.player_name, e.data?.speaker]) if (n) players.add(n); // both, as lines look them up either way
  names = nameMatcher(fresh); // 🎨 in the chat: names seen so far, this batch included
  for (const e of fresh) {
    seen.add(e.id); maxId = Math.max(maxId, e.id);
    if (hide.some(r => r.test(eventText(e)))) continue;
    const kind = sideKind(e.type || "");
    if (kind) { sideEv.push({ e, kind, at: Math.max(0, rows.length - 1) }); continue; } // placed after the line before it
    if (e.type === "persistent_generic" && rows.length && unwrap(eventText(rows.at(-1).e)) === unwrap(eventText(e))) continue; // repeats the narration just shown
    add(e);
  }
  const last = rows.at(-1)?.e;
  endMark.className = "endmark" + (archive ? "" : " live");
  const label = el("span", null, (!archive ? "Now" : archive.startsWith("conv:") ? "End of this day" : "End of this playthrough")
    + (last?.gameTimeStr ? " · " + last.gameTimeStr : ""));
  if (!archive) label.prepend(el("span", "pulse", "●")); // live
  endMark.replaceChildren(label);
  if (rows.length) feed.append(endMark); // moved back to the end after new lines
  renderScrubber();
  $("ndialog").textContent = feed.querySelectorAll(".msg:not(.bg)").length;
  $("nbg").textContent = feed.querySelectorAll(".msg.bg").length;
  $("nthought").textContent = feed.querySelectorAll(".thought").length;
  $("nnarr").textContent = feed.querySelectorAll(".narr").length;
  $("nact").textContent = feed.querySelectorAll(".act").length;
  for (const n of document.querySelectorAll("#actpanel .n")) n.textContent = feed.querySelectorAll(".act-" + n.dataset.act).length;
  if (first || !document.body.classList.contains("hide-autoscroll")) scrollTo(0, document.body.scrollHeight); // ⤓ button
  updatePosition();
  return true;
}

// archive = a playthrough database name from serve.py, or "" for the live game.
// gen stops a poll that was in flight when the view was switched from adding to the new view.
let archive = "", gen = 0, timer;
// ML: the modlist picked in History; LIVE_ML: the one being played (serve.py's pick: written to last). Live always reads LIVE_ML.
let ML = "", LIVE_ML = "";
const mlq = () => "ml=" + encodeURIComponent(archive ? ML : LIVE_ML);
function start() { clearTimeout(timer); reset(); poll(++gen); }

async function poll(g) {
  try {
    if (archive) { // a finished playthrough: load once, no polling
      const url = (archive.startsWith("conv:") ? `/local/conversation?day=${archive.slice(5)}` : `/local/events?db=${encodeURIComponent(archive)}`) + "&" + mlq();
      const events = await (await fetch(url)).json();
      if (g !== gen) return;
      ingest(events);
      loadMemories(g);
      $("dot").className = "dot arch";
      $("dot").title = "archived playthrough (not live)";
      return;
    }
    const events = maxId < 0 ? await fetchAll()
      : (await (await fetch(`${HOST}/?api=recent-events&count=${POLL_COUNT}`, { cache: "no-store" })).json()).events || [];
    if (g !== gen) return;
    // Newest id went backwards: another save or playthrough was loaded, so start over.
    // ponytail: misses a switch to a save whose newest id is higher; compare first-event ids if that bites.
    if (events.length && maxId >= 0 && Math.max(...events.map(e => e.id)) < maxId) return start();
    if (ingest(events)) loadMemories(g);
    $("dot").className = "dot ok";
    $("dot").title = "live";
  } catch {
    if (g !== gen) return;
    $("dot").className = "dot"; // game closed or server not up yet; keep trying
    $("dot").title = "not connected";
  }
  timer = setTimeout(() => poll(g), POLL_MS);
}

// Under serve.py (http://localhost:8791) older playthroughs can be picked from the menu.
const LOCAL = location.protocol.startsWith("http");
// Two kinds of history: the conversation log (every line ever said, by real day; survives loading older saves)
// and SkyrimNet's per-playthrough databases (with locations and game time, but cut back when an older save is loaded).
// One modlist at a time: picking one shows its newest playthrough (or Live, for the one being played).
async function fillHistory() {
  const q = "ml=" + encodeURIComponent(ML);
  const [days, list] = await Promise.all([fetch(`/local/conversation-days?${q}`).then(r => r.json()), fetch(`/local/playthroughs?${q}`).then(r => r.json())]);
  const live = el("option", null, `Live (current save · ${LIVE_ML})`);
  live.value = "";
  const conv = el("optgroup"), dbs = el("optgroup");
  conv.label = "Conversation log: every line, by real day";
  dbs.label = "Playthroughs, newest first (cut back when an older save loads)";
  for (const d of days) {
    const o = el("option", null, `${new Date(d.day + "T12:00").toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" })} · ${d.lines} lines`);
    o.value = "conv:" + d.day;
    conv.append(o);
  }
  for (const p of list) {
    const short = s => (s || "?").split(",")[0];
    const o = el("option", null, `${p.player || "(no player lines)"} · ${new Date(p.modified * 1000).toLocaleDateString()} · ${short(p.first_location)} → ${short(p.last_location)} · ${p.events} events`);
    o.value = p.db;
    o.title = `${p.first_time} → ${p.last_time}`;
    dbs.append(o);
  }
  $("pt").replaceChildren(live, dbs, conv); // playthroughs first, the long list of days after
  return list;
}
if (LOCAL) fetch("/local/modlists").then(r => r.json()).then(async mls => {
  for (const m of mls) {
    const o = el("option", null, m.name + (m.live ? " ●" : ""));
    o.value = m.name;
    o.title = m.folder + (m.live ? " (being played, or played last)" : "");
    $("ml").append(o);
  }
  ML = LIVE_ML = mls.find(m => m.live)?.name || "";
  const saved = new URLSearchParams(location.hash.slice(1)); // a refresh reopens the same view (see saveView)
  if (mls.some(m => m.name === saved.get("ml"))) ML = saved.get("ml");
  $("ml").value = ML;
  $("mlwrap").hidden = mls.length < 2; // one SkyrimNet folder: nothing to pick
  await fillHistory();
  $("ptwrap").hidden = false;
  const v = saved.get("view") || "";
  if (v && [...$("pt").options].some(o => o.value === v)) { archive = v; $("pt").value = v; start(); }
}).catch(() => {});
else { // opened from disk: say where the older playthroughs are instead of hiding the option
  $("ptwrap").replaceChildren("Older playthroughs: run serve.py, then open ", Object.assign(el("a", null, "localhost:8791"), { href: "http://localhost:8791/" }));
  $("ptwrap").hidden = false;
}
// #pt is absent when opened from disk (replaced by the hint above)
// The modlist and view live in the address (#ml=…&view=…), so a refresh or a bookmark opens them again.
function saveView() {
  const h = new URLSearchParams();
  if (ML && ML !== LIVE_ML) h.set("ml", ML);
  if (archive) h.set("view", archive);
  history.replaceState(null, "", String(h) ? "#" + h : location.pathname + location.search);
}
$("pt")?.addEventListener("change", ev => { archive = ev.target.value; saveView(); $("shot").close(); start(); });
$("ml")?.addEventListener("change", async ev => {
  ML = ev.target.value;
  const list = await fillHistory();
  archive = ML === LIVE_ML ? "" : list[0]?.db || ""; // the newest playthrough of a modlist that isn't running
  $("pt").value = archive;
  saveView(); $("shot").close(); start();
  menu.open = false;
});

// config.yaml. Reads the small part of YAML it uses: "key: value", lists of values ("- 'x'") and lists of maps
// ("- a: 1" then "  b: 2"). Values: 'quoted' or "quoted" text, yes/no/true/false, numbers, else plain text.
const hide = [];
function parseConfig(text) {
  const scalar = v => {
    v = v.trim();
    let q; // quoted, then maybe a " # comment"
    if ((q = v.match(/^'((?:[^']|'')*)'(?:\s+#.*)?$/))) return q[1].replace(/''/g, "'");
    if ((q = v.match(/^"([^"]*)"(?:\s+#.*)?$/))) return q[1];
    v = v.replace(/\s+#.*$/, "");
    if (/^(yes|true|on)$/i.test(v)) return true;
    if (/^(no|false|off)$/i.test(v)) return false;
    return v !== "" && !isNaN(v) ? +v : v;
  };
  const cfg = {};
  let key = null, item = null, m;
  for (const line of text.split(/\r?\n/)) {
    if (/^\s*(#|$)/.test(line)) continue;
    if ((m = line.match(/^(\w+):\s*(.*)$/))) { key = m[1]; item = null; cfg[key] = m[2].trim() ? scalar(m[2]) : []; continue; }
    if (!Array.isArray(cfg[key])) continue;
    if ((m = line.match(/^\s+-\s+(\w+):\s+(.*)$/))) { item = { [m[1]]: scalar(m[2]) }; cfg[key].push(item); continue; }
    if ((m = line.match(/^\s+-\s+(.*)$/))) { item = null; cfg[key].push(scalar(m[1])); continue; }
    if (item && (m = line.match(/^\s+(\w+):\s+(.*)$/))) item[m[1]] = scalar(m[2]);
  }
  return cfg;
}
async function loadConfig() {
  let cfg = {};
  try { cfg = parseConfig(await (await fetch("config.yaml", { cache: "no-store" })).text()); } catch {} // opened from disk: defaults
  for (const v of Array.isArray(cfg.hide) ? cfg.hide : []) {
    try { hide.push(new RegExp(v, "i")); } catch { console.warn("config.yaml: bad hide pattern", v); }
  }
  if (Array.isArray(cfg.column)) GROUPS = cfg.column.filter(g => g && g.label && g.types).flatMap(g => {
    try {
      return [{ key: "g-" + String(g.label).toLowerCase().replace(/[^a-z0-9]+/g, "") || "g", label: String(g.label),
                hue: +g.hue || 0, types: new RegExp(g.types), shown: g.shown !== false }];
    } catch { console.warn("config.yaml: bad column types", g.types); return []; }
  });
  if (cfg.memories === false) SHOW_MEM = false;
  if (cfg.omnisight === false) SHOW_OMNI = false;
  if (cfg.diary === false) SHOW_DIARY = false;
  buildColumnToggles();
}
loadConfig().then(start);
</script>
